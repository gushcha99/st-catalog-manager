name: Windows build and tests
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test data and GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --junitxml=build-test-results.xml
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm STCatalogManager.spec
      - name: Test packaged application
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath '.\dist\STCatalogManager\STCatalogManager.exe' -ArgumentList '--smoke-test --data-dir build\smoke-data' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Smoke test timeout' }
          if ($p.ExitCode -ne 0) { throw 'Smoke test failed' }
          if (-not (Test-Path 'build\smoke-data\catalog.sqlite3')) { throw 'Seed database missing' }
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist\STCatalogManager\README.md
          Copy-Item docs dist\STCatalogManager\docs -Recurse
          Compress-Archive -Path dist\STCatalogManager -DestinationPath dist\STCatalogManager-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: STCatalogManager-Windows-x64
          path: |
            dist/STCatalogManager-Windows-x64.zip
            build-test-results.xml
